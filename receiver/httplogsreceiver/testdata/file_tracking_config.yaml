httplogs:
  endpoint: 0.0.0.0:4433
  record_type: cwlogs
  access_key: "some_access_key"
  tls:
    cert_file: server.crt
    key_file: server.key
  storage: memstorage/main
  file_tracking:
    enabled: true
    file_attribute: my.file
    max_tracked_files: 42
    entry_ttl: 72h
    stale_checkpoint: reset
    on_error: fail
