display_name: HTTP Logs Receiver
type: httplogs

description: |
  The HTTP Logs Receiver is for ingesting HTTP logs and parsing the records received
  based on the configured record type.

status:
  class: receiver
  stability:
    alpha: [metrics, logs]
  distributions: [contrib]
  codeowners:
    active: [piffall]

attributes:
  backend:
    description: The checkpoint store backend in use.
    type: string
    enum: [inmem, storage]
  log_export_result:
    description: The outcome of forwarding decoded log records to the downstream consumer.
    type: string
    enum: [sent, failed, retried]
  on_error:
    description: The on_error policy in effect for the failed store operation.
    type: string
    enum: [degrade, fail]
  op:
    description: The checkpoint store operation that failed.
    type: string
    enum: [load, save]
  request_reason:
    description: The low-cardinality reason for the HTTP request outcome.
    type: string
    enum: [success, file_already_processed, invalid_access_key, unsupported_content_encoding, concurrency_limit, cancelled, decompression, invalid_payload, processing_error, upstream_retry]
  request_state:
    description: The outcome of an HTTP request.
    type: string
    enum: [accepted, duplicate, rejected]
  result:
    description: Outcome of a tracked file delivery.
    type: string
    enum: [fresh, resumed, stale]
  strategy:
    description: The concurrency strategy that rejected the request.
    type: string
    enum: [fast_fail]

telemetry:
  metrics:
    httplogs_receiver.concurrency.active_requests:
      enabled: true
      description: The number of requests currently being processed (holding a concurrency slot) by the receiver.
      extended_documentation: Only produced when max_concurrent_requests is set. It is the utilization signal against max_concurrent_requests.
      stability: development
      unit: "1"
      gauge:
        value_type: int
    httplogs_receiver.concurrency.requests_rejected_total:
      enabled: true
      description: The total number of requests rejected because max_concurrent_requests was reached.
      extended_documentation: Only produced when max_concurrent_requests is set and concurrency_strategy is "fast_fail". Each rejection responds 503 with a Retry-After header so the sender retries with backoff.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [strategy]
    httplogs_receiver.filetracking.errors_total:
      enabled: true
      description: The total number of checkpoint store operations that failed while processing a tracked file delivery.
      extended_documentation: Only produced when file_tracking.enabled is true. A non-zero "op=save, on_error=degrade" value means checkpoints are being dropped mid-delivery. That is expected with on_error=degrade (continued untracked, at-least-once preserved), but should be investigated in scaled deployments.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [backend, on_error, op]
    httplogs_receiver.filetracking.line_attr_batches_skipped_total:
      enabled: true
      description: The total number of log batches forwarded without the file.line attribute because their record count did not match the number of source lines decoded.
      extended_documentation: Only produced when file_tracking.enabled is true and the signal is logs. Non-zero in steady state means the configured encoding is not 1 line to 1 record for this receiver. The affected batches are still forwarded (with the file line attribute absent), and file tracking checkpointing is unaffected.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    httplogs_receiver.filetracking.resumed_files_total:
      enabled: true
      description: The total number of file deliveries processed with file tracking, by outcome (fresh file, resumed from a checkpoint, or stale checkpoint).
      extended_documentation: Only produced when file_tracking.enabled is true and the delivery carries a tracked file name. A non-zero "stale" result means resent files end before their recorded checkpoint (shrunk, truncated, or a different file reusing the name).
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [result]
    httplogs_receiver.filetracking.skipped_lines_total:
      enabled: true
      description: The total number of already-exported file lines skipped while resuming a tracked file delivery.
      extended_documentation: Only produced when file_tracking.enabled is true and the delivery carries a tracked file name with an existing checkpoint. Each resumed delivery is counted for the lines of its file it skips.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    httplogs_receiver.filetracking.tracked_files:
      enabled: true
      description: The number of files currently tracked by the in-memory checkpoint store.
      extended_documentation: Only produced when file_tracking.enabled is true and no storage extension is configured (the in-memory backend only). It is the capacity signal against max_tracked_files.
      stability: development
      unit: "1"
      gauge:
        value_type: int
    httplogs_receiver.logs.exports_total:
      enabled: true
      description: The total number of decoded log records handed to the downstream consumer, by export outcome.
      extended_documentation: Sent counts records accepted by the downstream consumer. Failed counts permanent downstream failures. Retried counts retryable downstream failures; the receiver itself does not retry, but returns a retryable HTTP response to the sender.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [log_export_result]
    httplogs_receiver.logs.freshness:
      enabled: true
      description: The age in seconds of the newest successfully exported log record at the time it was processed.
      extended_documentation: The gauge is updated when a newer log timestamp is successfully exported. The receiver has no balancer identity in its protocol, so the metric is scoped to this receiver instance.
      stability: development
      unit: s
      gauge:
        value_type: double
    httplogs_receiver.logs.lines_read_total:
      enabled: true
      description: The total number of decoded log records read from HTTP requests.
      extended_documentation: For file-tracked requests, this counts source lines observed by the tracking reader. For other requests, it counts decoded log records because the receiver cannot assume that an arbitrary encoding is line-oriented.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    httplogs_receiver.logs.lines_skipped_total:
      enabled: true
      description: The total number of log lines skipped because they were already exported by file tracking.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    httplogs_receiver.logs.lines_unparseable_total:
      enabled: true
      description: The total number of log decode failures.
      extended_documentation: A decode failure is counted once per failed decoder or whole-body decode operation because arbitrary encoding extensions do not expose a per-line failure count.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
    httplogs_receiver.requests_total:
      enabled: true
      description: The total number of HTTP requests handled by the receiver, by outcome and reason.
      extended_documentation: Accepted includes successfully processed requests. Duplicate is a tracked file resend for which every line was already exported. Rejected includes validation, decoding, cancellation, and downstream failures.
      stability: development
      unit: "1"
      sum:
        value_type: int
        monotonic: true
      attributes: [request_state, request_reason]

tests:
  config:
